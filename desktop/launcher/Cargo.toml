[package]
name = "hooked-launcher"
version = "0.1.0"
edition = "2024"
publish = false

# A member of the `desktop/` workspace: Rune comes from its `[workspace.dependencies]`, pinned once in
# desktop/Cargo.lock, and the root's `[patch.crates-io]` and `[profile.*]` apply.
[dependencies]
rune = { workspace = true }
rune-kit = { workspace = true }
ureq = { version = "3", features = ["json"] }
serde_json = "1"
libc = "0.2"
