[workspace]
members = [".", "launcher", "pr-gate", "ui"]

# Rune is pinned once, in Cargo.lock: every crate below comes from the same git source (no `rev`,
# so Rune's default branch), and Cargo resolves one source to one commit. A crate cannot drift to
# another rev than the others. Move them all with `cargo update -p rune`.
[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune" }
rune-kit = { git = "https://github.com/anomalyco/rune" }
rune-notify = { git = "https://github.com/anomalyco/rune" }
rune-luau = { git = "https://github.com/anomalyco/rune" }
rune-perf = { git = "https://github.com/anomalyco/rune" }
procwatch = { git = "https://github.com/anomalyco/rune" }
rune-knobs = { git = "https://github.com/anomalyco/rune" }
rune-register = { git = "https://github.com/anomalyco/rune" }

[package]
name = "hooked-rune"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
hooked-ui = { path = "ui" }
rune = { workspace = true }
rune-kit = { workspace = true, features = ["markdown", "mermaid"] }
rune-notify = { workspace = true }
rune-luau = { workspace = true, features = ["serde"] }
rune-perf = { workspace = true }
procwatch = { workspace = true }
rune-knobs = { workspace = true }
rune-register = { workspace = true, optional = true }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "483ea3d5247b214060da58ef6037a95f30ae89fb", features = ["png"] }

[features]
hot = ["rune/hot"]
frame-profile = ["rune/frame-profile", "rune-kit/frame-profile"]
# The ⌘⇧K tuning panel. Dev only: `cargo build --release` leaves it out.
knobs = ["rune-knobs/panel", "dep:rune-register", "hooked-ui/knobs"]

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.21"

# Rune builds these crates from its own patched copies, and Cargo does not inherit a dependency's
# `[patch]`. Copy the `[patch.crates-io]` table of Rune's root Cargo.toml, at the commit Cargo.lock
# pins; same git source as above, so the patches follow that commit.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune" }
naga = { git = "https://github.com/anomalyco/rune" }
winit = { git = "https://github.com/anomalyco/rune" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune" }
parley_engine = { git = "https://github.com/anomalyco/rune" }
accesskit_windows = { git = "https://github.com/anomalyco/rune" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune" }
accesskit_macos = { git = "https://github.com/anomalyco/rune" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
lto = "thin"
strip = true
