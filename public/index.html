<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🪝 hooked — sessions Claude</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div class="brand">🪝 <span>hooked</span></div>
    <nav class="tabs">
      <button class="tab active" data-view="sessions">Sessions</button>
      <button class="tab" data-view="stats">Stats &amp; usage</button>
    </nav>
    <div class="status">
      <span id="live-dot" class="dot"></span>
      <span id="live-label">connexion…</span>
    </div>
  </header>

  <main>
    <!-- VUE SESSIONS -->
    <section id="view-sessions" class="view active">
      <div class="layout">
        <aside class="sidebar">
          <div class="side-head">
            <div class="side-actions">
              <button id="ov-btn" class="ov-btn">🏠 Vue d'ensemble</button>
              <button id="new-btn" class="new-btn">＋ Nouvelle session</button>
            </div>
            <input id="search" type="search" placeholder="Rechercher…" />
            <div id="status-filter" class="status-filter"></div>
            <label class="chk"><input type="checkbox" id="hide-old" /> masquer &gt; 24h</label>
          </div>
          <div id="side-list" class="side-list"></div>
        </aside>
        <div id="main-pane" class="main-pane"></div>
      </div>
    </section>

    <!-- VUE STATS -->
    <section id="view-stats" class="view">
      <div class="toolbar">
        <div class="range" id="range">
          <button data-range="1">Aujourd'hui</button>
          <button data-range="7" class="active">7 jours</button>
          <button data-range="30">30 jours</button>
          <button data-range="all">Tout</button>
        </div>
      </div>
      <div id="kpis" class="kpis"></div>
      <div class="charts">
        <div class="card chart-card">
          <h3>Coût par jour <span class="sub">(estimé)</span></h3>
          <div id="chart-day"></div>
        </div>
        <div class="card chart-card">
          <h3>Par modèle</h3>
          <div id="chart-model"></div>
        </div>
        <div class="card chart-card">
          <h3>Par projet</h3>
          <div id="chart-project"></div>
        </div>
        <div class="card chart-card">
          <h3>Outils les plus utilisés</h3>
          <div id="chart-tool"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- détail session -->
  <div id="modal" class="modal hidden">
    <div class="modal-bg"></div>
    <div class="modal-card">
      <button id="modal-close" class="modal-close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
