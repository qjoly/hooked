[tools]
node = "26"
# pi (provider Mistral, branche feat/pi-mistral) — dans [tools] RACINE et pas dans une tâche :
# le service hooked est lancé par launchd/systemd via `mise x -- bash deploy/service-run.sh`
# (cf. tasks.service-install), donc seuls les tools racine sont dans le PATH du service.
# Avec le shim pi dispo, `which pi` réussit sous launchd et la détection auto
# (server/providers.js → providers.pi) marche sans fallback sur les chemins en dur.
# Sur une machine qui n'utilise pas le provider pi, retirer cette ligne (mise n'installera
# alors plus le package) — hooked détecte l'absence et masque pi.
"npm:@earendil-works/pi-coding-agent" = "1.6.0"

[env]
PORT = "4123"
# HOST is intentionally NOT set here: mise's [env] templating can't reference
# its own key from the invoking shell (`env.HOST` resolves against mise's own
# config context, not the process env), so `HOST=0.0.0.0 mise run ...` would
# silently be ignored. Each task instead defaults HOST via plain shell
# expansion (`${HOST:-127.0.0.1}`), which does see the real process env.
# Bind local-only by default. adapter-node listens on 0.0.0.0 out of the box,
# which would expose the dashboard (and session piloting) to the whole LAN.
# Override to expose it: `HOST=0.0.0.0 mise run start`.

[tasks.install]
description = "Installe les dépendances de build (devDeps front Svelte)"
run = "npm install"

[tasks.build]
description = "Build le front Svelte dans dist/"
depends = ["install"]
# The commit stamp lets deploy/service-run.sh skip its own rebuild when the
# service restarts right after an explicit build (mise run deploy).
run = "npm run build && (git rev-parse HEAD > build/.hooked-src-commit 2>/dev/null || true)"

[tasks.setup-hooks]
description = "Branche hooked sur les hooks Claude Code (~/.claude/settings.json)"
run = "node install.cjs"

# Le binaire pi vient de mise ([tools] "npm:@earendil-works/pi-coding-agent" — `mise x` le rend
# dispo, y compris pour le service). Cette tâche ne couvre que le setup MANUEL machine-spécifique
# qu'aucun gestionnaire de packages ne peut faire : le package Mistral + le sign-in OAuth
# (interactif) + le MCP hooked, tous dans ~/.pi/agent (cf. docs/port-pi.md §0).
[tasks.setup-pi]
description = "Setup manuel du provider pi (Mistral) : package pi-mistral-subscription + sign-in"
run = '''
set -e
command -v pi >/dev/null || { echo "✗ binaire pi introuvable — lance d'abord: mise use npm:@earendil-works/pi-coding-agent@1.6.0" >&2; exit 1; }
pi install https://github.com/5omeOtherGuy/pi-mistral-subscription
echo ""
echo "✅ Package pi-mistral-subscription installé (~/.pi/agent/settings.json)."
echo "Reste 2 étapes manuelles (interactives, cf. docs/port-pi.md §0) :"
echo "  1. Sign-in Mistral : lance \`pi\` dans un terminal et fais le sign-in OAuth"
echo "     (device flow 100 % API documenté dans docs/port-pi.md → ~/.pi/agent/auth.json, mode 0600)."
echo "  2. MCP hooked dans pi : ~/.pi/agent/mcp.json (stdio vers le serveur hooked, cf. docs/port-pi.md)."
echo "Dans hooked, providers.pi = 'auto' (défaut) suffit alors ; 'on' force, 'off' masque."
'''

# pi (and Claude through pi-claude-bridge, which excludes Claude Code's own context files) only sees
# what pi loads: this copies ~/.claude/CLAUDE.md into a managed block of ~/.pi/agent/AGENTS.md and
# adds ~/.claude/skills to pi's skills list. Safe to run again (after an edit of CLAUDE.md).
# Options after `--`: --dry-run, --no-instructions, --no-skills.
[tasks.pi-migrate]
description = "Bring the global CLAUDE.md and the Claude skills to pi"
run = "node scripts/pi-migrate.mjs"

[tasks.setup]
description = "Installation complète : deps + build + hooks Claude Code"
depends = ["build", "setup-hooks"]
run = '''
echo ""
echo "✅ hooked est prêt."
echo "▶  Démarre le dashboard avec : mise run start"
echo "   puis ouvre http://localhost:4123"
echo "↻  Pense à redémarrer tes sessions Claude Code pour activer les hooks."
'''

[tasks.start]
description = "Démarre le dashboard (http://localhost:4123)"
run = "HOST=${HOST:-127.0.0.1} BODY_SIZE_LIMIT=${BODY_SIZE_LIMIT:-21M} node build"

[tasks.dev]
description = "Lance Vite en mode dev (front uniquement)"
run = "npm run dev"

[tasks.dev-server]
description = "Lance le serveur Node en mode dev"
run = "BODY_SIZE_LIMIT=${BODY_SIZE_LIMIT:-21M} node build"

[tasks.test]
description = "Lance la suite Vitest"
run = "npm test"

[tasks.deploy]
description = "Rebuild le front puis redémarre le service (build && service-restart)"
run = "mise run build && mise run service-restart"

# A deploy restarts hooked, which cuts the turn of every driven session (the one running it
# included), so it is skipped when the build already holds the checkout's build inputs. The stamp
# (the commit deploy/service-run.sh built) is compared on those inputs only, so commits touching
# nothing else (desktop, docs) do not count. The mtime test catches edits made since the last
# build, and stops matching once they are built: rerunning after a restart cut it short is a no-op.
[tasks.deploy-if-stale]
description = "Redeploy the service only when its build lags behind the checkout"
run = '''
BUILD_INPUTS="src server static package.json package-lock.json vite.config.js"
STAMP="build/.hooked-src-commit"
if [ -f "$STAMP" ] \
  && git diff --quiet "$(cat "$STAMP")" HEAD -- $BUILD_INPUTS 2>/dev/null \
  && [ -z "$(find $BUILD_INPUTS -type f -newer "$STAMP" 2>/dev/null | head -1)" ]; then
  echo "hooked back end already up to date, no deploy."
else
  mise run deploy
fi
'''

# The service-* tasks dispatch on `uname -s`: launchd (LaunchAgent
# com.hooked.dashboard) on macOS, systemd --user (unit hooked-dashboard) on
# Linux. The unit is named hooked-dashboard — NOT hooked-dev, which is the
# separate dev-mode service installed by deploy/linux/install.sh.
# Both platforms run deploy/service-run.sh, which re-runs `npm ci` when the
# lockfile changed and (prod mode) rebuilds when HEAD moved — so the service
# survives a branch switch. `service-install --dev` bakes HOOKED_MODE=dev in
# and the same service runs Vite (HMR) instead of `node build`.

[tasks.service-install]
description = "Installe hooked comme service utilisateur (launchd sur macOS, systemd --user sur Linux) ; --dev = variante Vite HMR"
usage = '''
flag "--dev" help="Installe la variante dev (serveur Vite, HMR) au lieu du build prod"
'''
run = '''
set -e
PROJECT_DIR="$(pwd)"
# PATH of the user's shell at install time: lets the service find
# claude/git/gh/etc. even outside the default PATH (Nix →
# /run/current-system/sw/bin, Homebrew, mise shims…). launchd and systemd
# otherwise start services with a minimal PATH.
SERVICE_PATH="${PATH:-/usr/local/bin:/usr/bin:/bin}"
# Local-only by default; expose with `HOST=0.0.0.0 mise run service-install`.
SERVICE_HOST="${HOST:-127.0.0.1}"
# --dev (usage flag, surfaced as $usage_dev) → Vite dev server instead of
# `node build`. Baked into the service env: the mode sticks across restarts.
if [ "${usage_dev:-}" = "true" ]; then SERVICE_MODE="dev"; else SERVICE_MODE="prod"; fi
RUNNER="$PROJECT_DIR/deploy/service-run.sh"
chmod +x "$RUNNER"

case "$(uname -s)" in
Darwin)
  LABEL="com.hooked.dashboard"
  PLIST="$HOME/Library/LaunchAgents/$LABEL.plist"
  MISE_BIN="$(command -v mise || echo /opt/homebrew/bin/mise)"
  LOG_DIR="$HOME/Library/Logs/hooked"
  mkdir -p "$LOG_DIR" "$HOME/Library/LaunchAgents"

  # Unload first if already loaded (idempotent)
  launchctl unload "$PLIST" 2>/dev/null || true

  cat > "$PLIST" <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>Label</key>
    <string>$LABEL</string>
    <key>ProgramArguments</key>
    <array>
        <string>$MISE_BIN</string>
        <string>x</string>
        <string>--</string>
        <string>bash</string>
        <string>$RUNNER</string>
    </array>
    <key>WorkingDirectory</key>
    <string>$PROJECT_DIR</string>
    <key>EnvironmentVariables</key>
    <dict>
        <key>PATH</key>
        <string>$SERVICE_PATH</string>
        <key>PORT</key>
        <string>4123</string>
        <key>HOST</key>
        <string>$SERVICE_HOST</string>
        <key>HOOKED_MODE</key>
        <string>$SERVICE_MODE</string>
    </dict>
    <key>RunAtLoad</key>
    <true/>
    <key>KeepAlive</key>
    <true/>
    <key>StandardOutPath</key>
    <string>$LOG_DIR/out.log</string>
    <key>StandardErrorPath</key>
    <string>$LOG_DIR/err.log</string>
</dict>
</plist>
EOF

  launchctl load "$PLIST"
  echo "✅ Service $LABEL installé et démarré (mode $SERVICE_MODE)."
  echo "   Plist : $PLIST"
  echo "   Logs  : $LOG_DIR/{out,err}.log"
  ;;
Linux)
  UNIT="hooked-dashboard"
  UNIT_FILE="$HOME/.config/systemd/user/$UNIT.service"
  MISE_BIN="$(command -v mise || echo "$HOME/.local/bin/mise")"
  LOG_DIR="${XDG_STATE_HOME:-$HOME/.local/state}/hooked"
  mkdir -p "$LOG_DIR" "$HOME/.config/systemd/user"

  cat > "$UNIT_FILE" <<EOF
[Unit]
Description=hooked dashboard ($SERVICE_MODE)
After=network.target

[Service]
WorkingDirectory=$PROJECT_DIR
ExecStart="$MISE_BIN" x -- bash "$RUNNER"
# Quoted: an unquoted Environment= is split on whitespace, and PATH entries
# can contain spaces.
Environment="PATH=$SERVICE_PATH"
Environment="PORT=4123"
Environment="HOST=$SERVICE_HOST"
Environment="HOOKED_MODE=$SERVICE_MODE"
Restart=always
RestartSec=10
StandardOutput=append:$LOG_DIR/out.log
StandardError=append:$LOG_DIR/err.log

[Install]
WantedBy=default.target
EOF

  systemctl --user daemon-reload
  systemctl --user enable "$UNIT"
  systemctl --user restart "$UNIT"
  # Start at boot, not only once a session is opened
  loginctl enable-linger "$USER" >/dev/null 2>&1 || true

  echo "✅ Service $UNIT installé et démarré (mode $SERVICE_MODE)."
  echo "   Unit : $UNIT_FILE"
  echo "   Logs : $LOG_DIR/{out,err}.log (ou journalctl --user -u $UNIT -f)"
  ;;
*)
  echo "✗ OS non supporté : $(uname -s)" >&2
  exit 1
  ;;
esac
echo "   URL   : http://localhost:4123"
'''

[tasks.service-uninstall]
description = "Désinstalle le service hooked (launchd ou systemd --user)"
run = '''
set -e
case "$(uname -s)" in
Darwin)
  LABEL="com.hooked.dashboard"
  PLIST="$HOME/Library/LaunchAgents/$LABEL.plist"
  launchctl unload "$PLIST" 2>/dev/null || true
  rm -f "$PLIST"
  echo "✅ Service $LABEL désinstallé."
  ;;
Linux)
  UNIT="hooked-dashboard"
  systemctl --user disable --now "$UNIT" 2>/dev/null || true
  rm -f "$HOME/.config/systemd/user/$UNIT.service"
  systemctl --user daemon-reload
  echo "✅ Service $UNIT désinstallé."
  ;;
*)
  echo "✗ OS non supporté : $(uname -s)" >&2
  exit 1
  ;;
esac
'''

[tasks.service-status]
description = "Affiche l'état du service hooked (launchd ou systemd --user)"
run = '''
case "$(uname -s)" in
Darwin)
  LABEL="com.hooked.dashboard"
  if launchctl list | grep -q "$LABEL"; then
      launchctl list | grep "$LABEL"
      echo "(PID  Status  Label)"
  else
      echo "Service $LABEL non chargé."
  fi
  ;;
Linux)
  systemctl --user status hooked-dashboard --no-pager || true
  ;;
*)
  echo "✗ OS non supporté : $(uname -s)" >&2
  exit 1
  ;;
esac
'''

[tasks.service-logs]
description = "Tail les logs du service hooked"
run = '''
case "$(uname -s)" in
Darwin) LOG_DIR="$HOME/Library/Logs/hooked" ;;
Linux)  LOG_DIR="${XDG_STATE_HOME:-$HOME/.local/state}/hooked" ;;
*) echo "✗ OS non supporté : $(uname -s)" >&2; exit 1 ;;
esac
tail -f "$LOG_DIR/out.log" "$LOG_DIR/err.log"
'''

[tasks.service-restart]
description = "Redémarre le service hooked (launchd ou systemd --user)"
run = '''
set -e
case "$(uname -s)" in
Darwin)
  LABEL="com.hooked.dashboard"
  launchctl kickstart -k "gui/$(id -u)/$LABEL"
  echo "✅ Service $LABEL redémarré."
  ;;
Linux)
  UNIT="hooked-dashboard"
  systemctl --user restart "$UNIT"
  echo "✅ Service $UNIT redémarré."
  ;;
*)
  echo "✗ OS non supporté : $(uname -s)" >&2
  exit 1
  ;;
esac
'''

[tasks.screenshots]
description = "Regenerate docs/screenshots from a throwaway instance fed with fictional data (needs Google Chrome)"
run = "node scripts/screenshots.mjs"

# Rust n'est tiré que par ces tâches : le build du front n'en a pas besoin.
[tasks.desktop-icon]
description = "Régénère desktop/icons/icon.icns depuis static/icon-512.png (macOS)"
run = '''
set -e
SET="$(mktemp -d)/hooked.iconset"
mkdir -p "$SET"
for spec in 16 32 128 256 512; do
  sips -z $spec $spec static/icon-512.png --out "$SET/icon_${spec}x${spec}.png" >/dev/null
  sips -z $((spec*2)) $((spec*2)) static/icon-512.png --out "$SET/icon_${spec}x${spec}@2x.png" >/dev/null
done
iconutil -c icns "$SET" -o desktop/icons/icon.icns
'''

# Remplace l'app installée et la relance : une seule copie lançable, donc jamais
# de doute sur la version qui tourne.
[tasks.desktop]
description = "Build the desktop app, redeploy the service if stale, install it in /Applications and relaunch it"
dir = "desktop"
tools = { rust = "1.99.1", zig = "0.17.1" }
run = """
set -e
cargo build --release
APP="target/hooked.app"
rm -rf "$APP"
mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
cp target/release/hooked-rune "$APP/Contents/MacOS/"
cp Info.plist "$APP/Contents/"
cp icons/icon.icns "$APP/Contents/Resources/"
# Sign the bundle (ad hoc) so the binary carries the bundle id. The linker's own signature names
# it "hooked_rune-<hash>", and macOS then ignores the Local Network permission granted to
# dev.qjoly.hooked-rune: every connection to a LAN address fails with "No route to host".
codesign --force --sign - "$APP"
# The app reads some data (capabilities) once at launch, so the service is brought up to date before
# it starts. Before quitting the old app, too: if the restart takes down the session running this
# task, the old app keeps running, and a rerun finds the back end current and just installs.
# Not fatal: a failed deploy (or no installed service) should not cost the app build.
mise run deploy-if-stale || echo "⚠ back end not redeployed, the app may call a stale service" >&2
# Quit the running app, whatever name it was installed under (the old Tauri bundle, or the Rune
# app still called "hooked (Rune)"), then replace both with the single app at /Applications/hooked.app.
osascript -e 'quit app id "dev.qjoly.hooked"' 2>/dev/null || true
osascript -e 'quit app id "dev.qjoly.hooked-rune"' 2>/dev/null || true
sleep 1
rm -rf "/Applications/hooked.app" "/Applications/hooked (Rune).app"
ditto "$APP" "/Applications/hooked.app"
open "/Applications/hooked.app"
"""

[tasks.desktop-dev]
description = "Run the desktop app from source with live editing: body edits patch it in place, others rebuild and relaunch"
dir = "desktop"
tools = { rust = "1.99.1", zig = "0.17.1", python = "3.13" }
run = "scripts/dev"

[tasks.desktop-run]
description = "Run the desktop app from source once, without live editing"
dir = "desktop"
tools = { rust = "1.99.1", zig = "0.17.1" }
run = "cargo run --features knobs"

# The Android SDK comes from Android Studio or the command-line tools, not from mise.
[tasks.android]
description = "Build the Android tablet app and install it on the device adb sees"
dir = "android"
tools = { java = "temurin-21" }
run = """
set -e
if [ -z "$ANDROID_HOME" ]; then
  for d in "$HOME/Library/Android/sdk" "$HOME/Android/Sdk"; do
    [ -d "$d" ] && export ANDROID_HOME="$d" && break
  done
fi
./gradlew --quiet assembleRelease
APK="$PWD/app/build/outputs/apk/release/app-release.apk"
if adb get-state >/dev/null 2>&1; then
  adb install -r "$APK"
  adb shell am start -n dev.qjoly.hooked.android/dev.qjoly.hooked.MainActivity
else
  echo "No device on adb (USB, or adb connect <ip>:<port>). APK: $APK"
fi
"""
