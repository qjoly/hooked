[package]
name = "hooked-rune"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b", features = ["markdown", "mermaid"] }
rune-notify = { git = "https://github.com/anomalyco/rune", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b" }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "9b598d6528c08c013407052767bb2e885ba869ba" }

[features]
hot = ["rune/hot"]

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.21"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
strip = true
