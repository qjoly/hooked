<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🪝 hooked — Claude sessions</title>
  <!-- Thème : applique les choix persistants AVANT le premier rendu pour éviter le flash de
       thème (FOUC). Deux axes ORTHOGONAUX, tous deux relus ici :
       • clair/sombre — 'system' (défaut) → aucun attribut, prefers-color-scheme décide ;
         'light'/'dark' → data-theme forcé sur <html>.
       • palette (color-scheme) — 'default' (défaut) → aucun attribut ; 'legacy' (crème/terracotta)
         'datadog' (violet Datadog) et 'gruvbox' → data-scheme forcé.
       • coins — 'round' (défaut) → aucun attribut ; 'sharp' → data-corners, tout à angle vif.
       Doit rester synchro avec state.svelte.js. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('hooked.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        var s = localStorage.getItem('hooked.scheme');
        if (s === 'legacy' || s === 'datadog' || s === 'gruvbox') document.documentElement.setAttribute('data-scheme', s);
        var c = localStorage.getItem('hooked.corners');
        if (c === 'sharp') document.documentElement.setAttribute('data-corners', c);
      } catch (e) {}
    })();
  </script>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="hooked" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e7eaef" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101013" />
  %sveltekit.head%
</head>
<body>
  <div style="display: contents">%sveltekit.body%</div>
</body>
</html>
