# hooked × Mistral Vibe — hooks à merger dans ~/.vibe/hooks.toml (user-level).
#
# Chaque hook appelle scripts/hook-vibe.cjs, qui normalise l'évènement Vibe et l'append
# dans ~/.vibe/hooked/events.jsonl (lu par hooked exactement comme events.jsonl de Claude).
# Adapte HOOKED_ROOT ci-dessous au chemin absolu de ton checkout de hooked.
#
# Sans ces hooks, les sessions Vibe restent visibles dans hooked (scan du journal
# ~/.vibe/logs/session/unified) mais sans état live (working / attention / ended).

# [[hooks]]
# name = "hooked-session-start"
# type = "session_start"
# command = "node /Volumes/Stockage/code/hooked/scripts/hook-vibe.cjs"
#
# [[hooks]]
# name = "hooked-pre-agent"
# type = "pre_agent"
# command = "node /Volumes/Stockage/code/hooked/scripts/hook-vibe.cjs"
#
# [[hooks]]
